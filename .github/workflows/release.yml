name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build
        run: ./build.sh

      - name: Package
        run: |
          zip -r FinderReroute.zip FinderReroute.app

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            FinderReroute.zip
            scripts/install.sh
          generate_release_notes: true
