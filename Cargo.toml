[package]
name = "finder-reroute"
version = "0.1.0"
edition = "2021"
description = "macOS utility that reroutes Finder clicks to a preferred file manager"
license = "MIT"
repository = "https://github.com/alexleekt/FinderReroute"
keywords = ["macos", "finder", "file-manager", "dock", "accessibility"]
categories = ["command-line-utilities"]

[dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
axuielement = "0.9"
log = "0.4"
env_logger = "0.11"
thiserror = "2"
serde_json = "1"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"

[profile.release]
opt-level = 3
lto = true
